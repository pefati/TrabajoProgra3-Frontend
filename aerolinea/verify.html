<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificando cuenta - Aerolínea</title>
    <link rel="stylesheet" href="/src/styles/styles.css">
    <style>
        .verify-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .verify-card {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 3rem;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--primary-red);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-black text-white">
    <div id="navbar-container"></div>
    <div id="toast-container" class="toast-container"></div>

    <main class="verify-container">
        <div class="verify-card">
            <div id="loading-state">
                <div class="spinner"></div>
                <h1 class="text-3xl font-bold mb-4">Verificando tu cuenta</h1>
                <p class="text-gray-400">Por favor espera un momento...</p>
            </div>
            
            <div id="success-state" style="display: none;">
                <h1 class="text-3xl font-bold mb-4 text-green-500">¡Cuenta Verificada!</h1>
                <p class="text-gray-400 mb-6">Tu perfil ya fue verificado, serás redirigido para completarlo en 5s.</p>
                <a href="/login.html" class="btn-primary" style="display: inline-block;">Ir a Iniciar Sesión</a>
            </div>

            <div id="error-state" style="display: none;">
                <h1 class="text-3xl font-bold mb-4 text-red-500">Error de Verificación</h1>
                <p id="error-msg" class="text-gray-400 mb-6">El enlace de verificación es inválido o ha expirado.</p>
                <a href="/index.html" class="btn-secondary" style="display: inline-block;">Volver al Inicio</a>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script type="module" src="/src/scripts/verify.ts"></script>
</body>
</html>
