<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AeroGest — Admin Vuelos</title>
  <link rel="stylesheet" href="/src/styles/styles.css" />
  <link rel="stylesheet" href="/src/styles/admin.css" />
</head>
<body>
<div id="navbar-container"></div>

<main class="container admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-title">Administración</div>
    <a href="admin.html"><span class="icon">📊</span> Panel</a>
    <a href="admin-vuelos.html" class="active"><span class="icon">✈</span> Vuelos</a>
    <a href="admin-aeropuertos.html"><span class="icon">📍</span> Aeropuertos</a>
    <a href="admin-aviones.html"><span class="icon">🛩</span> Aviones</a>
    <a href="admin-usuarios.html"><span class="icon">👥</span> Usuarios</a>
    <a href="admin-reservas.html"><span class="icon">🎫</span> Reservas</a>
  </aside>
  <section class="admin-content">
    <div class="admin-toolbar">
      <div class="admin-header" style="margin-bottom:0">
        <h1>Vuelos</h1>
        <p>Crear, editar y eliminar vuelos.</p>
      </div>
      <button class="btn btn-dark" id="btn-nuevo-vuelo">+ Nuevo vuelo</button>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Origen</th>
            <th>Destino</th>
            <th>Salida</th>
            <th>Llegada</th>
            <th>Precio</th>
            <th>Estado</th>
            <th>Avion</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-vuelos"></tbody>
      </table>
    </div>
  </section>
</main>

<div id="footer"></div>
<div id="modal-container"></div>
<script type="module" src="/src/scripts/admin-vuelos.ts"></script>
</body>
</html>
