<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AeroCielo — Mis Reservas</title>
  <link rel="stylesheet" href="/src/styles/styles.css" />
</head>
<body>

<!--Navbar-->
<div id="navbar-container"></div>


<section class="booking-dashboard" style="margin-top:72px">
  <div class="container">
    <div class="dashboard-header">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px">
        <div>
          <h1 class="dashboard-welcome">Mis reservas</h1>
          <p style="color:var(--gray-500)">Gestioná tus vuelos, descargá documentos y hacé el check-in online</p>
        </div>
        <div style="display:flex;gap:12px">
          <a href="vuelos.html" class="btn btn-primary">+ Nueva reserva</a>
        </div>
      </div>

      <!-- Stats rápidas -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:28px">
        <div style="background:var(--white);border:1px solid var(--gray-500);border-radius:var(--radius-md);padding:20px">
          <div style="font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-500);margin-bottom:8px">Reservas activas</div>
          <div style="font-family:var(--font-display);font-size:30px;font-weight:700" id="stat-activas">0</div>
        </div>
        <div style="background:var(--white);border:1px solid var(--gray-500);border-radius:var(--radius-md);padding:20px">
          <div style="font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-500);margin-bottom:8px">Vuelos realizados</div>
          <div style="font-family:var(--font-display);font-size:30px;font-weight:700" id="stat-pasados">2</div>
        </div>
        <div style="background:var(--white);border:1px solid var(--gray-500);border-radius:var(--radius-md);padding:20px">
          <div style="font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-500);margin-bottom:8px">Millas acumuladas</div>
          <div style="font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--pink)">12.480</div>
        </div>
        <div style="background:var(--white);border:1px solid var(--gray-500);border-radius:var(--radius-md);padding:20px">
          <div style="font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-500);margin-bottom:8px">Nivel viajero</div>
          <div style="font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--navy)">✦ Silver</div>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="booking-tabs">
      <div class="booking-tab active" onclick="showTab('activas',this)">Próximos vuelos</div>
      <div class="booking-tab" onclick="showTab('pasadas',this)">Historial</div>
    </div>

    <!-- Buscar reserva -->
    <div style="display:flex;gap:12px;margin-bottom:24px">
      <input type="text" class="form-control" placeholder="Buscar por código, ruta o fecha..." id="search-booking" oninput="filtrarReservas()" style="max-width:360px" />
    </div>

    <!-- Lista activas -->
    <div id="tab-activas">
      <div class="booking-list" id="booking-list-activas">
        <!-- generado por JS -->
      </div>
    </div>

    <!-- Lista pasadas -->
    <div id="tab-pasadas" style="display:none">
      <div class="booking-list" id="booking-list-historial"></div>
    </div>


  </div>
</section>

<!-- Modal detalle de reserva -->
<div id="detail-modal" style="display:none;position:fixed;inset:0;background:rgba(10,22,40,0.7);z-index:999;align-items:center;justify-content:center">
  <div style="background:var(--white);border-radius:var(--radius-lg);padding:36px;max-width:500px;width:90%;animation:fadeInUp 0.3s ease">
    <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:24px">
      <h3 style="font-family:var(--font-display);font-size:22px;font-weight:800" id="modal-ruta">—</h3>
      <button onclick="closeModal()" style="background:none;border:none;font-size:24px;cursor:pointer;color:var(--gray-500)">×</button>
    </div>
    <div style="background:var(--navy);border-radius:var(--radius);padding:16px;margin-bottom:20px;color:var(--white)">
      <div style="font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:4px">Código de reserva</div>
      <div style="font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--white)" id="modal-codigo">—</div>
    </div>
    <div id="modal-detalles" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px"></div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="showToast('Descargando boarding pass...');closeModal()">Boarding pass</button>
      <button class="btn btn-dark" style="flex:1;justify-content:center" id="btn-cancelar-modal" onclick="cancelarReserva()">Cancelar reserva</button>
    </div>
  </div>
</div>

<!-- FOOTER -->
<div id="footer"></div>
<script type="module" src="/src/scripts/reservas.ts"></script>
</body>
</html>
