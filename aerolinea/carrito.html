<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AeroGest — Carrito</title>
  <link rel="stylesheet" href="src/styles/styles.css" />
</head>
<body>
<div id="navbar-container"></div>

<section class="booking-dashboard" style="margin-top:72px">
  <div class="container">
    <div class="dashboard-header">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px">
        <div>
          <h1 class="dashboard-welcome">Mi Carrito</h1>
          <p style="color:var(--gray-500)">Revisá los vuelos que seleccionaste antes de confirmar</p>
        </div>
        <button class="btn btn-outline" style="border-color:#c0392b;color:#c0392b" onclick="vaciarCarrito()">Vaciar carrito</button>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 300px;gap:24px;margin-top:28px;align-items:start" class="checkout-layout">
      <div id="carrito-list"></div>

      <!-- Summary -->
      <div class="seat-summary-card" style="position:sticky;top:90px">
        <h2 style="font-size:16px;font-weight:600;margin-bottom:16px">Resumen</h2>
        <div style="border-top:1px solid var(--navy-mid);padding-top:16px;margin-bottom:20px">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px">
            <span style="color:var(--gray-500)">Subtotal</span>
            <span id="carrito-subtotal">$0</span>
          </div>
          <div style="border-top:1px solid var(--navy);padding-top:12px;margin-top:8px;display:flex;justify-content:space-between">
            <span style="font-weight:600">Total</span>
            <span style="font-family:var(--font-display);font-size:20px;font-weight:700" id="carrito-total">$0</span>
          </div>
        </div>
        <button class="btn btn-primary btn-lg" style="width:100%;justify-content:center" onclick="irAPagar()">
          Continuar con el pago →
        </button>
      </div>
    </div>
  </div>
</section>

<div id="footer"></div>
<script type="module" src="/src/scripts/carrito.ts"></script>
</body>
</html>
