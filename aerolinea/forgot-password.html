<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AeroGest — Restablecer contraseña</title>
  <link rel="stylesheet" href="/src/styles/styles.css" />
</head>

<body>

  <div id="navbar-container"></div>
  <div id="toast-container" class="toast-container"></div>

  <main class="section">
    <div class="auth-container-log">
      <div class="auth-card animate">
        <div class="auth-header">
          <h2 class="auth-title">Restablecer <em>Contraseña</em></h2>
          <p class="auth-subtitle">Ingresa tu email y te enviaremos un enlace para crear una nueva contraseña.</p>
        </div>

        <form class="auth-form" id="forgot-form">
          <div class="form-group">
            <label for="forgot-email">Correo Electrónico</label>
            <input type="email" id="forgot-email" class="form-control" placeholder="ejemplo@correo.com" required>
          </div>

          <div class="auth-actions">
            <button type="submit" class="btn btn-primary btn-lg btn-block auth-btn-accent">Enviar enlace</button>
          </div>

          <div class="auth-footer">
            <a href="login.html" class="auth-link">Volver a Iniciar Sesión</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="footer"></div>
  <script type="module" src="/src/scripts/forgot-password.ts"></script>
</body>
</html>
