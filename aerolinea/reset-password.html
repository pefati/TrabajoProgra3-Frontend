<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AeroGest — Nueva contraseña</title>
  <link rel="stylesheet" href="/src/styles/styles.css" />
  <style>
    .verify-container {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .verify-card {
      background: rgba(20, 20, 20, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 3rem;
      max-width: 500px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>

<body>

  <div id="navbar-container"></div>
  <div id="toast-container" class="toast-container"></div>

  <main>
    <div id="reset-form-container" class="section" style="display: none;">
      <div class="auth-container-log">
        <div class="auth-card animate">
          <div class="auth-header">
            <h2 class="auth-title">Nueva <em>Contraseña</em></h2>
            <p class="auth-subtitle">Ingresa tu nueva contraseña para acceder a tu cuenta.</p>
          </div>

          <form class="auth-form" id="reset-form">
            <input type="hidden" id="reset-token">
            <div class="form-group">
              <label for="reset-password">Nueva Contraseña</label>
              <input type="password" id="reset-password" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>

            <div class="form-group">
              <label for="reset-confirm">Confirmar Contraseña</label>
              <input type="password" id="reset-confirm" class="form-control" placeholder="Repite la contraseña" required>
            </div>

            <div class="auth-actions">
              <button type="submit" class="btn btn-primary btn-lg btn-block auth-btn-accent">Restablecer</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="reset-success" class="verify-container" style="display: none;">
      <div class="verify-card">
        <h1 class="text-3xl font-bold mb-4 text-green-500">¡Contraseña Restablecida!</h1>
        <p class="text-gray-400 mb-6">Tu contraseña fue actualizada exitosamente.</p>
        <a href="login.html" class="btn-primary" style="display: inline-block;">Ir a Iniciar Sesión</a>
      </div>
    </div>

    <div id="reset-error" class="verify-container" style="display: none;">
      <div class="verify-card">
        <h1 class="text-3xl font-bold mb-4 text-red-500">Error</h1>
        <p id="reset-error-msg" class="text-gray-400 mb-6">El enlace es inválido o ha expirado.</p>
        <a href="forgot-password.html" class="btn-secondary" style="display: inline-block;">Solicitar nuevo enlace</a>
      </div>
    </div>
  </main>

  <div id="footer"></div>
  <script type="module" src="/src/scripts/reset-password.ts"></script>
</body>
</html>
