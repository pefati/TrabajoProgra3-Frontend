<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AeroGest — Admin Reservas</title>
  <link rel="stylesheet" href="/src/styles/styles.css" />
  <link rel="stylesheet" href="/src/styles/admin.css" />
</head>
<body>
<div id="navbar-container"></div>

<main class="container admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-title">Administración</div>
    <a href="admin.html"><span class="icon">📊</span> Panel</a>
    <a href="admin-vuelos.html"><span class="icon">✈</span> Vuelos</a>
    <a href="admin-aeropuertos.html"><span class="icon">📍</span> Aeropuertos</a>
    <a href="admin-aviones.html"><span class="icon">🛩</span> Aviones</a>
    <a href="admin-usuarios.html"><span class="icon">👥</span> Usuarios</a>
    <a href="admin-reservas.html" class="active"><span class="icon">🎫</span> Reservas</a>
  </aside>
  <section class="admin-content">
    <div class="admin-header" style="margin-bottom:16px">
      <h1>Reservas</h1>
      <p>Gestionar check-in y cancelación de reservas.</p>
    </div>
    <div style="display:flex;gap:12px;margin-bottom:20px">
      <input type="text" class="form-control" id="search-input" placeholder="Buscar por ID, email o nombre..." style="max-width:320px" oninput="filtrarReservas()" />
      <select class="form-control" id="filter-estado" style="max-width:180px" onchange="filtrarReservas()">
        <option value="">Todos los estados</option>
        <option value="CONFIRMADO">Confirmado</option>
        <option value="ACTIVO">Activo</option>
        <option value="PROCESANDO">Procesando</option>
        <option value="CANCELADA">Cancelada</option>
      </select>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Email</th>
            <th>Pasajes</th>
            <th>Valor</th>
            <th>Estado</th>
            <th>Fecha</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-reservas"></tbody>
      </table>
    </div>
  </section>
</main>

<div id="footer"></div>
<script type="module" src="/src/scripts/admin-reservas.ts"></script>
</body>
</html>
