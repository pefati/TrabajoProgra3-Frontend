<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AeroGest — Mi Perfil</title>
  <link rel="stylesheet" href="src/styles/styles.css" />
</head>
<body>
<div id="navbar-container"></div>

<main class="section" style="margin-top:72px">
  <div class="container" style="max-width:640px">

    <!-- Banner perfil incompleto -->
    <div id="perfil-banner" style="display:none;align-items:center;gap:12px;background:#FAEEDA;border:1px solid #e8c99a;border-radius:var(--radius-md);padding:16px 20px;margin-bottom:28px">
      <span style="font-size:24px">⚠️</span>
      <div>
        <div style="font-weight:700;color:#854F0B">Tu perfil está incompleto</div>
        <div style="font-size:13px;color:#6d4a1a">Completá todos los campos para poder realizar compras y guardar favoritos.</div>
      </div>
    </div>

    <div class="auth-card animate" style="max-width:100%">
      <div class="auth-header">
        <h2 class="auth-title">Mi <em>Perfil</em></h2>
        <p class="auth-subtitle">Actualizá tus datos personales para usar todos los servicios.</p>
      </div>

      <form class="auth-form" id="perfil-form">
        <div class="checkout-grid-2">
          <div class="form-group">
            <label for="p-nombre">Nombre</label>
            <input type="text" id="p-nombre" class="form-control" placeholder="Juan" required />
          </div>
          <div class="form-group">
            <label for="p-apellido">Apellido</label>
            <input type="text" id="p-apellido" class="form-control" placeholder="Pérez" required />
          </div>
        </div>

        <div class="form-group">
          <label for="p-email">Email</label>
          <input type="email" id="p-email" class="form-control" readonly style="opacity:0.6;cursor:not-allowed" />
        </div>

        <div class="form-group">
          <label for="p-telefono">Teléfono</label>
          <input type="tel" id="p-telefono" class="form-control" placeholder="+54 11 1234 5678" required />
        </div>

        <div class="checkout-grid-2">
          <div class="form-group">
            <label for="p-identificador">Tipo de documento</label>
            <select id="p-identificador" class="form-control" required>
              <option value="DNI">DNI</option>
              <option value="PASAPORTE">Pasaporte</option>
            </select>
          </div>
          <div class="form-group">
            <label for="p-dni">Número de documento</label>
            <input type="text" id="p-dni" class="form-control" placeholder="35123456" required />
          </div>
        </div>

        <div class="checkout-grid-2">
          <div class="form-group">
            <label for="p-sexo">Género</label>
            <select id="p-sexo" class="form-control" required>
              <option value="">Seleccioná...</option>
              <option value="MASCULINO">Masculino</option>
              <option value="FEMENINO">Femenino</option>
              <option value="OTRO">Otro</option>
            </select>
          </div>
          <div class="form-group">
            <label for="p-nacimiento">Fecha de nacimiento</label>
            <input type="date" id="p-nacimiento" class="form-control" required />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block auth-btn-accent">Guardar cambios</button>
      </form>
    </div>
  </div>
</main>

<div id="footer"></div>
<script type="module" src="/src/scripts/perfil.ts"></script>
</body>
</html>
