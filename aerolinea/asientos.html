<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AeroGest — Selección de asientos</title>
  <link rel="stylesheet" href="/src/styles/styles.css" />
</head>
<body>


<div id="navbar-container"></div>


<!-- Progreso -->
<div style="background:var(--white);border-bottom:1px solid var(--gray-500);padding:16px 0;margin-top:88px; box-shadow: inset 0 2px 4px var(--light-blue-1);">
  <div class="container">
    <div style="display:flex;align-items:center;gap:0;max-width:500px;margin:0 auto; ">
      <div style="display:flex;flex-direction:column;align-items:center;flex:1">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--success);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">✓</div>
        <span style="font-size:11px;margin-top:4px;color:var(--gray-700)">Vuelo</span>
      </div>
      <div style="flex:1;height:2px;background:var(--success)"></div>
      <div style="display:flex;flex-direction:column;align-items:center;flex:1">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--white);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">2</div>
        <span style="font-size:11px;margin-top:4px;font-weight:600;color:var(--navy)">Asientos</span>
      </div>
      <div style="flex:1;height:2px;background:var(--gray-500)"></div>
      <div style="display:flex;flex-direction:column;align-items:center;flex:1">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--gray-500);color:var(--gray-700);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">3</div>
        <span style="font-size:11px;margin-top:4px;color:var(--gray-700)">Pago</span>
      </div>
    </div>
  </div>
</div>

<section class="seat-page">
  <div class="container">
    <h1 style="font-family:var(--font-display);font-size:28px;font-weight:800;margin-bottom:8px">Elegí tu asiento</h1>
    <p style="color:var(--gray-500);margin-bottom:32px" id="vuelo-info">Cargando vuelo...</p>

    <div class="seat-layout">
      <!-- Resumen lateral -->
      <div class="seat-summary-card">
        <h2 style="font-size:16px;font-weight:600;margin-bottom:16px">Tu selección</h2>
        <div id="selected-seat-display" style="background:var(--navy);border-radius:var(--radius);padding:20px;text-align:center;color:var(--white);margin-bottom:20px">
          <div style="font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:8px" id="asientos-progress"></div>
          <div id="asientos-seleccionados" style="font-size:14px;color:rgba(255,255,255,0.8);margin-top:8px"></div>
        </div>

        <div class="seat-legend">
          <div class="legend-item"><div class="legend-dot dot-first"></div><span>Primera clase</span></div>
          <div class="legend-item"><div class="legend-dot dot-available"></div><span>Disponible</span></div>
          <div class="legend-item"><div class="legend-dot dot-selected"></div><span>Tu elección</span></div>
          <div class="legend-item"><div class="legend-dot dot-taken"></div><span>Ocupado</span></div>
        </div>

        <div style="border-top:1px solid var(--navy-mid);padding-top:16px;margin-bottom:20px">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px">
            <span style="color:var(--gray-500)">Vuelo base</span>
            <span id="base-price">$0</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px">
            <span style="color:var(--gray-500)">Asiento</span>
            <span id="seat-price">—</span>
          </div>
          <div style="border-top:1px solid var(--navy);padding-top:12px;margin-top:8px;display:flex;justify-content:space-between">
            <span style="font-weight:600">Total</span>
            <span style="font-family:var(--font-display);font-size:20px;font-weight:700" id="total-price">$0</span>
          </div>
        </div>

        <button class="btn btn-primary btn-lg" style="width:100%;justify-content:center" onclick="continuarPago()" id="btn-continue">
          Continuar con el pago →
        </button>
      </div>

      <!-- Mapa de cabina -->
      <div class="cabin-map" id="cabin-map">
        <h2 class="sr-only">Mapa de asientos del avión</h2>
        <div class="cabin-plane-nose">✈</div>
        <!-- generado por JS -->
      </div>
    </div>
  </div>
</section>

<!-- FOOTER -->
<div id="footer"></div>
<script type="module" src="/src/scripts/asientos.ts"></script>
</body>
</html>
